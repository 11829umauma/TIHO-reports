<style>

  .card { background:#fff; border-radius:12px; padding:32px 36px;

          text-align:center; }

           color:#fff; background:#2563eb; border:none; border-radius:8px;
           cursor:pointer; }
  button:disabled { background:#93c5fd; }

</style></head>
