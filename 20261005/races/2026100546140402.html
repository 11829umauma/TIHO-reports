<style>

  .card { background:#fff; border-radius:12px; padding:32px 36px;
          box-shadow:0 4px 16px rgba(15,23,42,.08); width:min(90vw,340px);
          text-align:center; }

           color:#fff; background:#2563eb; border:none; border-radius:8px;
           cursor:pointer; }
  button:disabled { background:#93c5fd; }
  .err { color:#dc2626; font-size:12px; min-height:16px; margin:8px 0 0; }
</style></head>

</div>

  var SS = "keiba_site_key";
  function b64(s) {
    var bin = atob(s), a = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
    return a;

  function hex(a) {
    return Array.from(new Uint8Array(a)).map(function(x) {
      return x.toString(16).padStart(2, "0"); }).join("");

  function unhex(s) {
    var a = new Uint8Array(s.length / 2);
    for (var i = 0; i < a.length; i++) a[i] = parseInt(s.substr(i * 2, 2), 16);

  }

    var pt = await crypto.subtle.decrypt(

    function doShow() {

  }
