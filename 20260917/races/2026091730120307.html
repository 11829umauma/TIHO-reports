<style>

           color:#fff; background:#2563eb; border:none; border-radius:8px;

</style></head>

  function b64(s) {
    var bin = atob(s), a = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);

  function hex(a) {
