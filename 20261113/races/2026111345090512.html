<title>Members</title>

<style>
  body { margin:0; font-family:'Segoe UI','Hiragino Sans',Meiryo,sans-serif;

         align-items:center; justify-content:center; }
  .card { background:#fff; border-radius:12px; padding:32px 36px;
          box-shadow:0 4px 16px rgba(15,23,42,.08); width:min(90vw,340px);
          text-align:center; }
  h1 { font-size:15px; color:#334155; margin:0 0 18px; font-weight:600; }
  input { width:100%; box-sizing:border-box; padding:10px 12px; font-size:15px;
          border:1px solid #cbd5e1; border-radius:8px; margin-bottom:12px; }
  button { width:100%; padding:10px; font-size:14px; font-weight:600;
           color:#fff; background:#2563eb; border:none; border-radius:8px;
           cursor:pointer; }
  button:disabled { background:#93c5fd; }
  .err { color:#dc2626; font-size:12px; min-height:16px; margin:8px 0 0; }
</style></head>

</div>
