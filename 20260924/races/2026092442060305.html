<style>

  .card { background:#fff; border-radius:12px; padding:32px 36px;

          text-align:center; }

           color:#fff; background:#2563eb; border:none; border-radius:8px;
           cursor:pointer; }
  button:disabled { background:#93c5fd; }

</style></head>

  var SS = "keiba_site_key";
  function b64(s) {
    var bin = atob(s), a = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
    return a;

  function hex(a) {

  function unhex(s) {
